<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d1c">
  <title>DreamMotion AI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #090d1c;
      color: white;
      font-family: Arial, sans-serif;
    }
    .app { max-width: 520px; margin: auto; }
    header { text-align: center; padding: 22px 0; }
    header h1 { color: #a78bfa; font-size: 30px; margin: 0 0 8px; }
    header p { color: #aab2ca; }
    .panel {
      background: #151c32;
      border: 1px solid #293452;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }
    label { display: block; margin: 15px 0 9px; font-weight: bold; }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #394565;
      background: #0d1428;
      color: white;
      font-size: 15px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #7c3aed, #2563eb);
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }
    #message { color: #c4b5fd; text-align: center; line-height: 1.6; }
    .small { color: #9ca8c5; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>✨ DreamMotion AI</h1>
      <p>Turn Your Images Into Videos</p>
    </header>

    <section class="panel">
      <h2>🎬 Create Your Video</h2>

      <label for="imageInput">আপনার ছবি নির্বাচন করুন</label>
      <input id="imageInput" type="file" accept="image/*">
      <img id="preview" alt="আপনার নির্বাচিত ছবির প্রিভিউ">

      <label for="prompt">ভিডিও কেমন হবে লিখুন</label>
      <textarea id="prompt" placeholder="যেমন: ছবির মানুষটি ধীরে ধীরে হাসবে..."></textarea>

      <label for="duration">ভিডিওর দৈর্ঘ্য</label>
      <select id="duration">
        <option value="5">৫ সেকেন্ড</option>
        <option value="10">১০ সেকেন্ড</option>
      </select>

      <button id="generateBtn">✨ Generate Video</button>
      <p id="message">প্রথমে একটি ছবি আপলোড করুন।</p>
    </section>

    <section class="panel">
      <h3>📌 দৈনিক ভিডিও সীমা</h3>
      <p>সাধারণ ব্যবহারকারী: সর্বোচ্চ ৩টি</p>
      <p>Owner: সর্বোচ্চ ১০টি</p>
      <p class="small">এগুলো পরিকল্পিত সীমা। প্রকৃত ব্যবহার সার্ভার ও GPU কোটা যুক্ত হলে কার্যকর হবে।</p>
    </section>

    <p class="small">DreamMotion AI © 2026</p>
  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");
    const generateBtn = document.getElementById("generateBtn");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) {
        preview.style.display = "none";
        message.textContent = "প্রথমে একটি ছবি আপলোড করুন।";
        return;
      }

      if (!file.type.startsWith("image/")) {
        message.textContent = "অনুগ্রহ করে একটি ছবি নির্বাচন করুন।";
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      message.textContent = "ছবি আপলোড হয়েছে! এখন ভিডিও তৈরির জন্য প্রস্তুত।";
    });

    generateBtn.addEventListener("click", function () {
      if (!imageInput.files[0]) {
        message.textContent = "আগে একটি ছবি আপলোড করুন।";
        return;
      }

      message.textContent =
        "ছবি প্রস্তুত! ভিডিও জেনারেশন চালু করতে পরের ধাপে API যুক্ত করতে হবে।";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(console.error);
    }
  </script>
</body>
        </html>
